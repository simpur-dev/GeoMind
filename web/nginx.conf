# web 容器的 nginx 站点（架构 §9.2 三栏壳只消费契约；§9.6 前端零业务判断——这里也只有转发）
#
# /api 反代必须关缓冲：SSE(/api/sessions/{sid}/events) 是长连接流，
# 一旦 nginx 攒缓冲区，浏览器就会「连上了但事件迟迟不来」（本项目按 vite 代理同款教训处理）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://host.docker.internal:8000;   # 不带 URI：路径原样透传（后端路由本就在 /api 下）
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;              # 单页回退
    }
}
